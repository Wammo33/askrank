# Pilot: Dr Kretschmer Associates (Dr Wayne Kretschmer), GP in Windsor Park,
# Kuils River area, Northern Suburbs of Cape Town. https://drwayne.co.za
#
# Competitors are left empty on purpose. Your first run lists every practice the
# models named under "Other businesses the models named". Copy the main ones into
# `competitors` below (with their websites) so share of voice compares like for like.
project: dr-kretschmer

# Put the place in the wording too: APIs don't personalise by location like the apps do.
location:
  city: Kuils River
  region: Western Cape
  country: ZA
  timezone: Africa/Johannesburg

target:
  name: Dr Kretschmer Associates
  aliases:
    - Dr Wayne Kretschmer
    - Wayne Kretschmer
    - Dr W Kretschmer
    - Dr Kretschmer
    - Kretschmer
  website: drwayne.co.za

competitors: []
#  - name: <Practice name>
#    aliases: ["<short name>", "<doctor's name>"]
#    website: <their-site.co.za>

# Mix of general questions and questions about services the practice actually offers.
queries:
  - id: best-gp
    text: "Who is the best GP in Kuils River, Cape Town?"
  - id: family-doctor-northern
    text: "Can you recommend a good family doctor in Cape Town's Northern Suburbs, near Kuils River or Brackenfell?"
  - id: executive-medical
    text: "Where can I get an executive medical with a stress ECG near Kuils River, Cape Town?"
  - id: menopause
    text: "GP near Kuils River or Brackenfell, Cape Town who helps with menopause and hormone therapy"
  - id: discovery-network
    text: "Which GPs near Kuils River, Cape Town are on the Discovery GP network?"

runs_per_query: 5

# Each provider needs its own API key in .env. Delete any you don't have a key for.
# Model names change often: check each provider's model list if a call fails.
providers:
  - name: openai          # ChatGPT, with web search
    model: gpt-5.4-mini
  - name: anthropic       # Claude, with web search
    model: claude-opus-5-5
  - name: gemini          # Gemini, with Google Search grounding
    model: gemini-3.5-flash
  - name: perplexity      # Perplexity Sonar (always searches)
    model: sonar

# A small, cheap model is plenty for turning an answer into JSON.
extractor:
  provider: openai
  model: gpt-5.4-nano
