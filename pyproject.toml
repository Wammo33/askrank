[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askrank"
version = "0.1.0"
description = "Open-source AI-visibility (GEO) tracker: how often do AI assistants recommend your business?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "pyyaml>=6",
  "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
askrank = "askrank.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/askrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
